[project]
name = "scout-it"
version = "0.1.0"
description = "Data collection tool for the AI football scouting platform (Pipeline A)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.10",
    "unidecode>=1.3",
    "click>=8.1",
    "tenacity>=9.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
markers = ["slow: hits live sites, excluded by default"]
addopts = "-m 'not slow'"
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper", "etl", "db", "config"]
